name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    name: lake build (Lean formalisation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_verification
          use-mathlib-cache: true

  figures:
    name: witness scripts reproduce the figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: sync pinned environment
        run: uv sync
      - name: render figures from committed artifacts
        run: |
          uv run python figures/make_lorenz_ramp.py
          uv run python figures/make_cert_vs_meas.py
          test -f figures/lorenz_ramp.pdf
          test -f figures/cert_vs_meas.pdf

  export-integrity:
    name: manifest hashes match the files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify EXPORT_MANIFEST.txt
        run: grep -v '^#' EXPORT_MANIFEST.txt | sha256sum -c --quiet
